<!doctype html>
<!--
  A stand-in for RBC's sign-in page: the one element rbc.js keys on is the client-card / username
  field, matched by its accessible name. When the harness lands here (no or expired session) and no
  person is present, the import must fail as "session expired", not record an empty statement.
-->
<html>
  <body>
    <form>
      <label for="K1">Client Card or Username</label>
      <input id="K1" name="K1" type="text" />
      <button type="submit">Next</button>
    </form>
  </body>
</html>
