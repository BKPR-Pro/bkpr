name: ci

# Prove the code builds and the tests pass on every push to main and every pull
# request, so a broken build is caught here rather than when a release tag is cut.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile the release targets
        run: |
          # Catch a build that breaks on a target the release will ship (a
          # missing platform stub, say) before the tag is cut, not after.
          for target in \
            darwin/amd64 darwin/arm64 \
            linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "building $target"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o /dev/null ./cli
          done
