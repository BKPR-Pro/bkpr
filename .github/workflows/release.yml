name: release

# Cutting a release is pushing a tag. The tag names the version; this workflow
# cross-compiles bkpr for every supported OS/arch and attaches the binaries to the
# GitHub Release so another machine can run bkpr without a Go toolchain.
#
# workflow_dispatch is a manual fallback for the rare case a tag push doesn't
# reach Actions (GitHub occasionally drops the event for a push that carries a
# tag; ci.yml's own push trigger can miss the same push, so it isn't a bug in
# this file) - re-run for the tag by name instead of hand-building a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish a release for (e.g. v0.2.1)"
        required: true

permissions:
  contents: write # create the release and upload the binaries

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the binaries
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          # One static, dependency-free binary per target. The tag is stamped in
          # so `bkpr version` reports the release rather than (devel). bkpr is
          # Unix-only (it relies on flock-based log locking and ioctl isatty), so
          # the matrix is macOS and Linux on both architectures.
          for target in \
            darwin/amd64 darwin/arm64 \
            linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/bkpr-${os}-${arch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" ./cli
          done
          # A checksum file so a download can be verified before it is trusted.
          (cd dist && sha256sum bkpr-* > checksums.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          # Idempotent: a manual re-run (the workflow_dispatch fallback above)
          # can target a tag someone already published by hand, so upload to
          # the existing release instead of failing on "already exists".
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "$VERSION" \
              --generate-notes
          fi
