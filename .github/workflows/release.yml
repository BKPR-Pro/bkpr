name: release

# Cutting a release is pushing a tag. The tag names the version; this workflow
# cross-compiles bkpr for every supported OS/arch and attaches the binaries to the
# GitHub Release so another machine can run bookkeeper without a Go toolchain.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload the binaries

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          # One static, dependency-free binary per target. The tag is stamped in
          # so `bkpr version` reports the release rather than (devel). bookkeeper is
          # Unix-only (it relies on flock-based log locking and ioctl isatty), so
          # the matrix is macOS and Linux on both architectures.
          for target in \
            darwin/amd64 darwin/arm64 \
            linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/bkpr-${os}-${arch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" ./cli
          done
          # A checksum file so a download can be verified before it is trusted.
          (cd dist && sha256sum bkpr-* > checksums.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
